services:
  # ── Backend Web Service ──────────────────────────────────────
  - type: web
    name: hs-mgmt-api
    env: node
    plan: free
    region: oregon
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: CORS_ORIGIN
        value: https://hs-mgmt-web.onrender.com # Update this after frontend deployment
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: DB_HOST
        sync: false
      - key: DB_USER
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: DB_NAME
        value: highschool_db

  # ── Frontend Static Site ─────────────────────────────────────
  - type: web
    name: hs-mgmt-web
    env: static
    plan: free
    buildCommand: npm install && npm run build
    #region: oregon
    staticPublishPath: frontend/dist
    headers:
      - path: /*
        name: Cache-Control
        value: no-cache
